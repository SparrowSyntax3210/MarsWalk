<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100b08" />
    <meta name="description" content="MarsWalk — explore the surface of Jezero Crater." />
    <title>MarsWalk — Explore Mars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/home.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="landing">
      <div class="landing-screen" id="landing-screen">
        <div class="scene" aria-hidden="true">
          <div class="planet-glow"></div>
          <canvas id="mars-scene"></canvas>
        </div>
        <div class="shade" aria-hidden="true"></div>

        <header class="topbar">
          <a class="brand" href="./" aria-label="MarsWalk home">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="brand-name">MARS<span>WALK</span></span>
          </a>
          <div class="topline" aria-hidden="true"></div>
          <span class="top-index">FIELD SYSTEMS <b>01</b></span>
        </header>

        <section class="hero-copy" aria-labelledby="hero-title">
          <p class="eyebrow"><span class="eyebrow-dot"></span> JEZERO CRATER · MARS</p>
          <h1 id="hero-title">MARS</h1>
          <p class="hero-subtitle">A new world to explore.</p>
          <a class="explore-button" href="./map.html">
            <span>Explore surface</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </a>
        </section>

        <footer class="bottom-bar">
          <div class="location-note"><span class="status-ring"></span><span>JEZERO CRATER</span><span class="note-divider">/</span><span>18.4° N&nbsp; 77.7° E</span></div>
          <div class="model-credit">MARS MODEL <span>NASA / JPL-CALTECH</span></div>
          <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">
            <span class="motion-icon" aria-hidden="true">Ⅱ</span><span>Pause rotation</span>
          </button>
        </footer>
        <div class="scroll-cue" id="scroll-cue" aria-hidden="true"><span></span> SCROLL TO EXPLORE</div>
        <p class="loading-note" id="loading-note" role="status">Preparing Mars surface…</p>
      </div>
    </main>
    <script type="module" src="./js/home.js"></script>
  </body>
</html>
